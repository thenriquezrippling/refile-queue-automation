# Copy this file to .github/workflows/filing_ticket_automation.yml
# (GitHub API token cannot create new workflow files in this repo.)
name: Filing Ticket Automation - Monthly

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Run as-of date (YYYY-MM-DD)"
        required: false
        type: string
      only:
        default: all
        type: choice
        options: [all, monthly, quarterly, semi-monthly]
      exclude_states:
        required: false
        type: string
      dry_run:
        type: boolean
        default: false

jobs:
  create-filing-tickets:
    name: Create Filing Tickets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run Filing Ticket Automation
        env:
          JIRA_BASE_URL: https://rippling.atlassian.net
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.as_of }}" ]; then ARGS+=(--as-of "${{ inputs.as_of }}"); fi
          if [ -n "${{ inputs.only }}" ] && [ "${{ inputs.only }}" != "all" ]; then ARGS+=(--only "${{ inputs.only }}"); fi
          if [ -n "${{ inputs.exclude_states }}" ]; then ARGS+=(--exclude-states "${{ inputs.exclude_states }}"); fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          python filing_ticket_automation.py "${ARGS[@]}"
