name: Filing Ticket Automation - Monthly

on:
  schedule:
    # Runs at 8:00 AM UTC (midnight PST) on the 1st of every month
    # On Mar/Jun/Sep/Dec 1st it also creates quarterly tickets
    - cron: "0 8 1 * *"
  workflow_dispatch:

jobs:
  create-filing-tickets:
    name: Create Filing Tickets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Filing Ticket Automation
        env:
          JIRA_BASE_URL: https://rippling.atlassian.net
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python filing_ticket_automation.py
